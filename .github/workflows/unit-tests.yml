name: Unit tests

on:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Run unit tests
        run: node --test --test-force-exit scripts/analytics-filters.test.mjs scripts/analytics-load-guard.test.mjs scripts/analytics-client-filters.test.mjs scripts/analytics-management.test.mjs scripts/analytics-teams.test.mjs scripts/grounds-maintenance-sites.test.mjs scripts/local-test-database.test.mjs scripts/photo-upload-input-attrs.test.mjs scripts/caretaker-inspection-route.test.mjs scripts/delete-device-inspection-draft.test.mjs
      - name: Run module-alias unit tests
        run: node --import ./scripts/esm-alias-register.mjs --test --test-force-exit scripts/caretaker-submission-payload.test.mjs scripts/caretaker-issue-triggers.test.mjs scripts/caretaker-estates-action-export.test.mjs scripts/caretaker-estates-mailbox-notification.test.mjs scripts/inspection-report-zip.test.mjs scripts/inspection-bulk-pdf-client.test.mjs scripts/own-record-scope.test.mjs
